appId: com.itachi1706.gi-weekly-material-tracker.datatool
productName: GI Weekly Material Tracker Data Management Tool
directories:
  output: dist
  buildResources: build
# Ad-hoc sign the bundle post-pack so the unsigned app still launches on Apple Silicon.
afterPack: build/afterPack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!dataset/*'
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: universal
  category: public.app-category.developer-tools
  # Unsigned local build — no Apple Developer identity. Gatekeeper may warn on first launch
  # (right-click → Open, or `xattr -cr <app>`); electron-builder ad-hoc signs for arm64.
  identity: null
  artifactName: GIWMT-DataTool-${version}-${arch}.${ext}
win:
  target:
    - nsis
