sonar.projectKey=itachi1706_GI-Weekly-Material-Tracker
sonar.organization=itachi1706

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=GI-Weekly-Material-Tracker
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.exclusions=lib/firebase_options.dart,lib/app_secrets.dart,public/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.icns,**/*.ttf,**/*.woff,**/*.woff2,**/*.mp3,**/*.wav,**/*.xcf,**/*.psd

# data-tool (Electron/TS) unit-test coverage. Generated by `npm run test:cov` (Vitest v8 → LCOV).
# The Sonar CI job rebases the LCOV `SF:` paths to `data-tool/...` (they are emitted relative to
# data-tool/) so they resolve against the repo-root project base dir. Test files + config are not
# production code, so they are excluded from coverage measurement.
sonar.javascript.lcov.reportPaths=data-tool/coverage/lcov.info
sonar.coverage.exclusions=data-tool/**/*.test.ts,data-tool/vitest.config.ts,data-tool/electron.vite.config.ts,data-tool/scripts/**,data-tool/*.config.*


# Disable C/C++/Obj-C for now (Till we figure out how to do it on GH Actions for Flutter)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
