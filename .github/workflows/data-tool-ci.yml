name: Data Tool CI

on:
  push:
    paths:
      - ".github/workflows/data-tool-ci.yml"
      - "data-tool/**"
  pull_request:
    paths:
      - ".github/workflows/data-tool-ci.yml"
      - "data-tool/**"
  workflow_dispatch:

# CI only reads the repo (build/typecheck); no writes needed.
permissions:
  contents: read

concurrency:
  group: data-tool-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: Typecheck + Build
    defaults:
      run:
        working-directory: data-tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Use Node.JS 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: data-tool/package-lock.json
      - run: npm ci --ignore-scripts # supply-chain hardening: block dependency lifecycle scripts (none are needed to build/package here)
      - run: npm run typecheck
      - run: npm run build

  build-mac:
    runs-on: macos-latest # current GitHub macOS image; electron-builder emits a UNIVERSAL dmg (Intel + Apple Silicon)
    name: Build macOS (universal .dmg)
    needs: check
    if: github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: data-tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Use Node.JS 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: data-tool/package-lock.json
      - run: npm ci --ignore-scripts # supply-chain hardening: block dependency lifecycle scripts (none are needed to build/package here)
      - name: Build unsigned universal DMG
        run: npm run build:mac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datatool-dmg-ci
          path: data-tool/dist/*.dmg
          retention-days: 30
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    name: Build Windows (.exe)
    needs: check
    if: github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: data-tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Use Node.JS 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: data-tool/package-lock.json
      - run: npm ci --ignore-scripts # supply-chain hardening: block dependency lifecycle scripts (none are needed to build/package here)
      - name: Build NSIS installer
        run: npm run build:win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datatool-exe-ci
          path: data-tool/dist/*.exe
          retention-days: 30
          if-no-files-found: error
