name: gi_weekly_material_tracker
description: Genshin Impact Weekly Weekly Tracker App

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

# RELEASE USE ONLY. LEAVE COMMENTED OTHERWISE
# flutter build apk --target-platform android-arm64 --split-per-abi
#version: 1.0.0+141

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  about: ^2.2.0
  appcheck: ^1.8.1
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.10.2
  cupertino_icons: ^1.0.9 # To prevent build errors
  device_info_plus: ^12.4.0
  filesize: ^2.0.1
  file_picker: ^10.3.10
  firebase_analytics: ^12.6.1
  firebase_app_check: ^0.4.9
  firebase_auth: ^6.7.1
  firebase_core: ^4.15.2
  firebase_crashlytics: ^5.4.1
  firebase_database: ^12.6.1
  firebase_cached_image: ^0.10.1
  firebase_performance: ^0.11.7
  firebase_storage: ^13.6.1
  firebase_ui_auth: ^3.1.1
  firebase_ui_database: ^2.0.1
  firebase_ui_oauth_google: ^2.1.1
  flutter_countdown_timer: ^4.1.0
  flutter_file_dialog: ^3.3.6
  flutter_local_notifications: ^17.2.4
  flutter_material_design_icons: ^3.1.0+7447
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.3.4
  get: ^4.7.3
  google_sign_in: ^6.3.0
  intl: ^0.20.2
  model_viewer_plus: ^1.10.0
  octo_image: ^2.1.4
  omni_datetime_picker: ^2.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  settings_ui: ^4.0.2
  shared_preferences: ^2.5.6
  sign_in_button: ^5.0.0
  stop_watch_timer: ^3.2.2
  store_redirect: ^2.0.4
  timezone: ^0.9.4
  url_launcher: ^6.3.3
  zikzak_inappwebview: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # We disable integration test as we are not running any currently
  #integration_test:
  #  sdk: flutter
  dart_code_linter: ^4.4.5
  # dart run dependency_validator
  dependency_validator: ^5.1.0
  dot_shorthand_converter: ^0.0.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Update with dart run flutter_native_splash:create
flutter_native_splash:
  image: assets/icons/splash/splash.png
  color: "#FFFFFF"
  image_dark: assets/icons/splash/splash_dark.png
  color_dark: "#000000"

# Update with dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher_custom"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_foreground: assets/icons/appicon/android_foreground.png
  adaptive_icon_background: "#FF5722"
  adaptive_icon_monochrome: assets/icons/appicon/android_foreground.png
  adaptive_icon_foreground_inset: 24
  image_path_android: assets/icons/appicon/launcher_icon.png
  image_path_ios: assets/icons/appicon/launcher_ios.png
  web:
    generate: true
    image_path: assets/icons/splash/splash_dark.png

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/elements/
    - assets/images/items/
    - assets/images/icons/
    - assets/icons/splash/splash.png
    - assets/icons/splash/splash_dark.png
    - CHANGELOG.md

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  fonts:
    - family: Product-Sans
      fonts:
        - asset: fonts/Product-Sans.ttf
        - asset: fonts/Product-Sans-Italic.ttf
          style: italic
    - family: Product-Sans-Bold
      fonts:
        - asset: fonts/Product-Sans-Bold.ttf
        - asset: fonts/Product-Sans-Bold-Italic.ttf
          style: italic

dependency_overrides:
  # Remove on Flutter 3.47+ and zikzak_inappwebview 6.3.4+, current version conflicts otherwise
  zikzak_inappwebview_platform_interface: 5.1.2
  zikzak_inappwebview_android: 5.1.2
  zikzak_inappwebview_ios: 5.1.2
  zikzak_inappwebview_macos: 5.1.2
  zikzak_inappwebview_web: 5.1.2
  zikzak_inappwebview_windows: 5.1.2
  zikzak_inappwebview_linux: 5.1.2
